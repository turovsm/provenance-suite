name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_DB: provenance_vault_test
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  SECURITY_PEPPER: ci_pepper_value_0123456789abcdef0123456789abcdef
  JWT_SECRET_KEY: ci_jwt_secret_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  ENVIRONMENT: testing

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provenance_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint & Format (ruff)
        run: |
          .venv/bin/ruff check src/ tests/
          .venv/bin/ruff format --check src/ tests/

      - name: Run migrations against test database
        run: .venv/bin/alembic upgrade head

      - name: Run tests
        run: .venv/bin/pytest -v --tb=short

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit tests
        run: npx ng test --watch=false

  ci-status:
    name: CI Status Gate
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify build outcomes
        run: |
          backend_status="${{ needs.backend.result }}"
          frontend_status="${{ needs.frontend.result }}"
          
          echo "Backend Job Status:  $backend_status"
          echo "Frontend Job Status: $frontend_status"
          
          if [ "$backend_status" = "failure" ] || [ "$frontend_status" = "failure" ]; then
            echo "CI pipeline failed."
            exit 1
          fi
          
          echo "All active build checks succeeded."