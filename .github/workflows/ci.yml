name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_DB: provenance_vault_test
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  SECURITY_PEPPER: ci_pepper_value_0123456789abcdef0123456789abcdef
  JWT_SECRET_KEY: ci_jwt_secret_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  ENVIRONMENT: testing

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provenance_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint & Format (ruff)
        run: |
          .venv/bin/ruff check src/ tests/
          .venv/bin/ruff format --check src/ tests/

      - name: Run migrations against test database
        run: .venv/bin/alembic upgrade head

      - name: Run tests
        run: .venv/bin/pytest -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit tests
        run: npx ng test --watch=false
