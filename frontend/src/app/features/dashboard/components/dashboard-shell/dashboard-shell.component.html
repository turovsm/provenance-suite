<div class="workspace-viewport-container">
  <div class="telemetry-grid-overlay"></div>

  <aside class="workspace-sidebar">
    <div class="sidebar-branding">
      <div class="branding-glyph">◈</div>
      <span class="branding-text">PROVENANCE // CORE</span>
    </div>

    <nav class="navigation-matrix">
      <div class="matrix-section-title">MEDIA PRESERVATION PARTITIONS</div>
      <ul class="nav-links-list">
        @for (category of archiveCategories; track category.query) {
          <li>
            <a
              [routerLink]="['/collections', category.query]"
              routerLinkActive="active-partition-link"
              class="partition-link"
            >
              <span class="link-bullet">▪</span> {{ category.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar-system-status">
      <div class="status-node"><span class="pulse-dot"></span> SECURE TUNNEL ONLINE</div>
    </div>
  </aside>

  <div class="workspace-content-canvas">
    <header class="workspace-top-bar">
      <div class="system-metrics-ticker">
        <span>LEDGER_STATE // SYNCHRONIZED</span>
      </div>

      <div class="session-identity-widget">
        @if (authState.identity(); as user) {
          <span class="active-user-handle" [title]="user.id"> USER // {{ user.email }} </span>
        }
        <button (click)="executeSignOut()" class="signout-trigger-btn" title="Terminate Session">
          TERMINATE_SESSION ⤓
        </button>
      </div>
    </header>

    <main class="canvas-routing-outlet">
      <router-outlet />
    </main>
  </div>
</div>
