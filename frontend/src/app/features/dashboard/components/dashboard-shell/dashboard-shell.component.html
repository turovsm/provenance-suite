<div class="workspace-viewport-container">
  <div class="telemetry-grid-overlay"></div>

  <aside class="workspace-sidebar">
    <div class="sidebar-branding">
      <span class="material-symbols-outlined branding-logo">album</span>
      <span class="branding-text">PROVENANCE</span>
    </div>

    <nav class="navigation-matrix">
      <div class="matrix-section-title">MUSIC CATEGORIES</div>
      <ul class="nav-links-list">
        @for (category of archiveCategories; track category.query) {
          <li>
            <a
              [routerLink]="category.isAll ? ['/'] : ['/collections', category.query]"
              [routerLinkActive]="'active-partition-link'"
              [routerLinkActiveOptions]="{ exact: category.isAll }"
              class="partition-link"
            >
              <span class="material-symbols-outlined link-icon">{{ category.icon }}</span>
              <span>{{ category.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar-system-status">
      <div class="status-node"><span class="pulse-dot"></span> System Online</div>
    </div>
  </aside>

  <div class="workspace-content-canvas">
    <header class="workspace-top-bar">
      <div class="system-metrics-ticker">
        <span>Provenance Music Library</span>
      </div>

      <div class="session-identity-widget">
        @if (authState.identity(); as user) {
          <span class="active-user-handle" [title]="user.id">
            <span class="material-symbols-outlined user-icon">person</span>
            <span>{{ user.email }}</span>
            @if (user.is_superuser) {
              <span class="admin-badge">[ADMIN]</span>
            }
          </span>
        }
        <button (click)="executeSignOut()" class="signout-trigger-btn" title="Sign Out">
          <span class="material-symbols-outlined btn-icon">logout</span>
          <span>Sign Out</span>
        </button>
      </div>
    </header>

    <main class="canvas-routing-outlet">
      <router-outlet />
    </main>
  </div>
</div>
