<div class="catalog-grid-layout">
  <header class="grid-control-bar">
    <app-search-input
      [value]="state.searchQuery()"
      placeholder="Search by title, artist, or folder..."
      (searchChange)="handleSearchChange($event)"
    />

    <div class="header-right-cluster">
      @if (authState.isAdmin()) {
        <button (click)="openAddModal()" class="admin-add-btn" title="Add New Album">
          <span class="material-symbols-outlined btn-icon">add</span>
          <span>Add Album</span>
        </button>
      }
    </div>
  </header>

  <app-error-banner [message]="state.error()" />

  <div class="grid-scroll-area">
    @if (state.isLoading()) {
      <div class="loading-state-overlay">
        <span class="pulse-indicator">Loading albums...</span>
      </div>
    } @else {
      @if (!state.hasAlbums()) {
        <app-empty-state
          icon="library_music"
          title="No Albums Found"
          description="No albums match your active search query."
        />
      } @else {
        <div class="albums-responsive-grid">
          @for (album of state.albums(); track album.id) {
            <app-album-card
              [album]="album"
              [isAdmin]="authState.isAdmin()"
              [isLoadingEdit]="loadingEditId() === album.id"
              (cardClicked)="handleSelectAlbum($event)"
              (editRequested)="handleEditAlbum($event)"
              (deleteRequested)="handleDeleteAlbum($event)"
            />
          }
        </div>
      }
    }
  </div>

  @if (!state.isLoading() && state.hasAlbums()) {
    <app-pagination-bar
      [currentPage]="state.currentPage()"
      [totalPages]="state.totalPages()"
      [totalCount]="state.totalCount()"
      [pageSize]="state.pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      itemLabel="album"
      itemPluralLabel="albums"
      (pageChange)="handlePageChange($event)"
      (pageSizeChange)="handlePageSizeChange($event)"
    />
  }

  @if (isAddModalOpen) {
    <app-album-form-modal [albumToEdit]="albumToEdit()" (closed)="closeAddModal()" />
  }

  @if (state.selectedAlbumDetail()) {
    <app-album-detail-drawer />
  }
</div>
