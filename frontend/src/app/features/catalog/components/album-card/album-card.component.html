<div
  class="glass-album-card"
  role="button"
  [attr.tabindex]="0"
  (click)="handleCardClick()"
  (keydown.enter)="handleCardClick()"
>
  <div class="cover-frame">
    @if (coverUrl() && !hasImageError()) {
      <img
        [ngSrc]="coverUrl()!"
        [fill]="true"
        [alt]="album().title_original"
        class="cover-image"
        (error)="onImageError()"
      />
    } @else {
      <div class="cover-placeholder">
        <span class="material-symbols-outlined cover-fallback-icon">graphic_eq</span>
      </div>
    }
  </div>

  <div class="card-meta">
    <h3 class="title-primary" [title]="album().title_original">
      {{ album().title_original }}
    </h3>

    @if (artistName()) {
      <p class="artists-line" [title]="artistName()">
        {{ artistName() }}
      </p>
    }

    <div class="card-footer-metrics">
      <span class="disc-count-badge">
        {{ album().total_discs }} {{ album().total_discs === 1 ? 'Disc' : 'Discs' }}
      </span>

      @if (formattedReleaseDate(); as relDate) {
        <span class="release-date">{{ relDate }}</span>
      }
    </div>

    <app-card-actions
      [isAdmin]="isAdmin()"
      [isLoadingEdit]="isLoadingEdit()"
      editLabel="Edit"
      deleteLabel="Delete"
      (edit)="handleEdit()"
      (delete)="handleDelete()"
    />
  </div>
</div>
