<section class="form-section" [formGroup]="form">
  <h3 class="section-heading">Basic Identification Parameters</h3>

  <div class="field-group">
    <label for="title_original">ORIGINAL TITLE *</label>
    <input
      id="title_original"
      type="text"
      formControlName="title_original"
      placeholder="e.g. 沙耶の唄 オリジナルサウンドトラック"
    />
  </div>

  <div class="field-group">
    <span class="field-label">TITLE ALIASES (Press Enter to add)</span>
    <app-aliases-chip-input formControlName="aliases"></app-aliases-chip-input>
  </div>

  <div class="form-row">
    <div class="field-group flex-2">
      <span class="field-label">ALBUM ARTIST / CIRCLE *</span>
      <app-entity-autocomplete
        entityType="artist"
        formControlName="album_artist_id"
        placeholder="Search master artist or circle (e.g. 上海アリス幻樂団)..."
      />
    </div>
  </div>

  <div class="field-group">
    <span class="field-label">ARTIST ALIASES (Press Enter to add)</span>
    <app-aliases-chip-input formControlName="album_artist_aliases"></app-aliases-chip-input>
  </div>

  <div class="form-row">
    <div class="field-group flex-1">
      <span class="field-label">CONVENTION / EVENT</span>
      <app-entity-autocomplete
        entityType="event"
        formControlName="event_id"
        placeholder="Search event (e.g. Comiket 100)..."
      />
    </div>
    <div class="field-group flex-1">
      <span class="field-label">MEDIA FRANCHISE</span>
      <app-entity-autocomplete
        entityType="franchise"
        formControlName="franchise_id"
        placeholder="Search franchise (e.g. 沙耶の唄)..."
      />
    </div>
  </div>

  <div class="field-group">
    <span class="field-label">FRANCHISE ALIASES (Press Enter to add)</span>
    <app-aliases-chip-input formControlName="franchise_aliases"></app-aliases-chip-input>
  </div>

  <div class="form-row">
    <div class="field-group flex-1">
      <label for="release_year">RELEASE YEAR</label>
      <input
        id="release_year"
        type="number"
        formControlName="release_year"
        placeholder="2004"
        min="1800"
        max="2100"
      />
    </div>
    <div class="field-group flex-1">
      <label for="release_month">MONTH (1–12)</label>
      <input
        id="release_month"
        type="number"
        formControlName="release_month"
        placeholder="2"
        min="1"
        max="12"
      />
    </div>
    <div class="field-group flex-1">
      <label for="release_day">DAY (1–31)</label>
      <input
        id="release_day"
        type="number"
        formControlName="release_day"
        placeholder="27"
        min="1"
        max="31"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="field-group flex-1">
      <span class="field-label">RECORD LABEL</span>
      <app-entity-autocomplete
        entityType="label"
        formControlName="label"
        placeholder="e.g. Lantis"
      />
    </div>
    <div class="field-group flex-1">
      <span class="field-label">PUBLISHER / DISTRIBUTOR</span>
      <app-entity-autocomplete
        entityType="publisher"
        formControlName="publisher"
        placeholder="e.g. Bandai Namco"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="field-group flex-1">
      <label for="storage_drive">STORAGE MOUNT / DRIVE</label>
      <input
        id="storage_drive"
        type="text"
        formControlName="storage_drive"
        placeholder="e.g. NAS-01 / E"
      />
    </div>
    <div class="field-group flex-2">
      <label for="relative_path">RELATIVE STORAGE PATH</label>
      <input
        id="relative_path"
        type="text"
        formControlName="relative_path"
        placeholder="e.g. Music/OST/沙耶の唄/"
      />
    </div>
  </div>

  <div class="field-group">
    <label for="original_folder_name">ORIGINAL ARCHIVAL FOLDER NAME *</label>
    <input
      id="original_folder_name"
      type="text"
      formControlName="original_folder_name"
      placeholder="e.g. [2004.02.27] ZIZZ STUDIO — 沙耶の唄 オリジナルサウンドトラック {HBMS-008} [CD-FLAC]"
    />
  </div>
</section>
