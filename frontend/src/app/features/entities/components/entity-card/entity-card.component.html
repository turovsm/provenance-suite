<div
  class="glass-entity-card"
  role="button"
  [attr.tabindex]="0"
  (click)="handleCardClick()"
  (keydown.enter)="handleCardClick()"
>
  <div class="card-top-row">
    <app-entity-avatar
      [imageUrl]="entity().image_url"
      [name]="entity().name_original"
      [entityType]="entity().entity_type"
      size="sm"
    />

    <div class="card-header-meta">
      <span [class]="'type-badge badge-' + entity().entity_type">
        {{ entity().franchise_type || entity().entity_type }}
      </span>

      <h3 class="entity-title" [title]="entity().name_original">
        {{ entity().name_original }}
      </h3>
    </div>
  </div>

  @if (entity().aliases && entity().aliases.length > 0) {
    <p class="aliases-text" [title]="entity().aliases.join(', ')">
      {{ entity().aliases.join(' · ') }}
    </p>
  }

  @if (cleanDescription()) {
    <p class="description-snippet">
      {{ cleanDescription() }}
    </p>
  }

  @if (isSuperuser()) {
    <div class="card-admin-actions">
      <button
        type="button"
        (click)="handleEdit($event)"
        class="card-edit-btn"
        [disabled]="isLoadingEdit()"
        title="Edit Entity"
      >
        <span class="material-symbols-outlined action-icon">edit</span>
        <span>Edit</span>
      </button>

      <button
        type="button"
        (click)="handleDelete($event)"
        class="card-delete-btn"
        [disabled]="isLoadingEdit()"
        title="Delete Entity"
      >
        <span class="material-symbols-outlined action-icon">delete</span>
        <span>Delete</span>
      </button>
    </div>
  }
</div>
